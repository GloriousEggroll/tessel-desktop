[package]
name = "tessel-power-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Power/battery backend shared by tessel-power and tessel-battery (power_backend.py, power_charge_limits.py; GTK parts behind the `gtk` feature)."

[features]
default = []
# power_style.py + power_battery_ui.py widgets (the status binaries link without GTK).
gtk = ["dep:gtk", "dep:tessel-gtk"]

[dependencies]
tessel-core.workspace = true
glib.workspace = true
gio.workspace = true
serde_json.workspace = true
libc.workspace = true
gtk = { workspace = true, optional = true }
tessel-gtk = { workspace = true, optional = true }
