[package]
name = "suite-lock"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared lock-screen / login-manager model (lock_config.py, login_model.py) and, with feature `gtk`, the lock dashboard widgets shared by lock-screen, login-manager and home-assistant-screen."

[lib]
name = "suite_lock"
path = "src/lib.rs"

[features]
default = []
# lock_visuals, lock_media*, lock_info, lock_dashboard, lock_weather, lock_palette
# (voice_state and the palette sampler are plain Rust and always built).
gtk = ["dep:gtk", "dep:glib", "dep:gio", "dep:suite-gtk", "dep:media-manager", "dep:weather-manager"]

[dependencies]
suite-core.workspace = true
serde_json.workspace = true
libc.workspace = true
gtk = { workspace = true, optional = true }
glib = { workspace = true, optional = true }
gio = { workspace = true, optional = true }
suite-gtk = { workspace = true, optional = true }
# The MPRIS client, player icons and album art (lock_media*.py) already live in
# media-manager's library; the weather backend in weather-manager's.
media-manager = { path = "../../components/media-manager", optional = true }
weather-manager = { path = "../../components/weather-manager", optional = true }

# The widgets' headless checks (LoginLayer frame clock, opaque underlay,
# stationary backdrop pixels) run in components/home-assistant-screen's
# tests/run_headless.sh (check `suite_lock_widgets`).
