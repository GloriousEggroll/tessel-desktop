[package]
name = "suite-lock"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared lock-screen / login-manager model (lock_config.py, login_model.py) and, with feature `gtk`, the lock dashboard widgets shared by lock-screen, login-manager and home-assistant-screen."

[lib]
name = "suite_lock"
path = "src/lib.rs"

[features]
default = []
# lock_visuals, lock_media*, lock_info, lock_dashboard, lock_weather, voice_state,
# lock_palette (ported by the lock-screen port).
gtk = []

[dependencies]
suite-core.workspace = true
serde_json.workspace = true
