[package]
name = "tessel-notifications"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Notification daemon, history popup and settings for the labwc Tessel (Rust port)."

[lib]
name = "tessel_notifications"
path = "src/lib.rs"

# Mirrors tessel_notifications.py (--daemon/--check/--settings/--popup).
[[bin]]
name = "tessel-notifications"
path = "src/main.rs"

# Mirrors tessel_notifications_status.py (Tessel Dock indicator stream); GLib/Gio only.
[[bin]]
name = "tessel-notifications-status"
path = "src/bin/tessel-notifications-status.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true
indexmap = "2"

[[test]]
name = "dbus"
path = "tests/dbus.rs"
harness = false

[[test]]
name = "headless"
path = "tests/headless.rs"
harness = false
