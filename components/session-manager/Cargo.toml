[package]
name = "session-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "On-demand session popup/menu: lock, switch user, log out, sleep, restart, power off (port of btmanager/session-manager)."

[lib]
name = "session_manager"
path = "src/lib.rs"

[[bin]]
name = "session-manager"
path = "src/main.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
