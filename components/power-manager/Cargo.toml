[package]
name = "power-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Session power policy: profiles popup, Power Settings, swayidle owner, lid/power key, battery alerts."

[lib]
name = "power_manager"
path = "src/lib.rs"

[[bin]]
name = "power-manager"
path = "src/main.rs"

[[bin]]
name = "power-status"
path = "src/bin/power-status.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
glib-unix = "0.22"
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true

[[test]]
name = "private_bus"
path = "tests/private_bus.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
