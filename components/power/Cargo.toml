[package]
name = "tessel-power"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Session power policy: profiles popup, Power Settings, swayidle owner, lid/power key, battery alerts."

[lib]
name = "tessel_power"
path = "src/lib.rs"

[[bin]]
name = "tessel-power"
path = "src/main.rs"

[[bin]]
name = "tessel-power-status"
path = "src/bin/tessel-power-status.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
tessel-power-core = { workspace = true, features = ["gtk"] }
glib.workspace = true
gio.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true

[[test]]
name = "private_bus"
path = "tests/private_bus.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
