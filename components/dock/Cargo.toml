[package]
name = "tessel-dock"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tessel's dock/panel: application menu, StatusNotifier tray, indicators and appearance publishers."

[lib]
name = "tessel_dock"
path = "src/lib.rs"

[[bin]]
name = "tessel-dock"
path = "src/main.rs"

# Runs one application inside the unit the dock starts for it.
[[bin]]
name = "tessel-dock-launch"
path = "src/bin/tessel-dock-launch.rs"

# The Caps Lock status stream.
[[bin]]
name = "tessel-capslock-status"
path = "src/bin/tessel-capslock-status.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
tessel-wayland = { workspace = true, features = ["glib", "gtk"] }
tessel-media = { path = "../media" }
tessel-network-discovery = { path = "../network-discovery" }
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true
indexmap = "2"
x11rb = { version = "0.13", default-features = false }
roxmltree = "0.21"
glib-unix.workspace = true

[[test]]
name = "wl_headless"
harness = false

[[test]]
name = "b_private_bus"
harness = false

[[test]]
name = "g_settings_headless"
harness = false

[[test]]
name = "f2_ui_headless"
harness = false

[[test]]
name = "f1_ui_headless"
harness = false

[[test]]
name = "e_headless"
harness = false
