[package]
name = "wayshell-prompt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Port of wayshell_prompt.py: on-demand labwc promptCommand/errorCommand dialog (+ install_prompts.py pure logic)."

[lib]
name = "wayshell_prompt"
path = "src/lib.rs"

[[bin]]
name = "wayshell-prompt"
path = "src/main.rs"

[[bin]]
name = "wayshell-install-prompts"
path = "src/bin/wayshell-install-prompts.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
wayshell-theme = { path = "../wayshell-theme" }
glib.workspace = true
gio.workspace = true
gtk.workspace = true
libc.workspace = true
regex.workspace = true
sha2 = "0.10"
roxmltree = "0.21"
serde_json.workspace = true


[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
