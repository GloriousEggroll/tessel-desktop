[package]
name = "network-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "NetworkManager popup, settings, connection editor and secret agent (netman)."

[lib]
name = "network_manager"
path = "src/lib.rs"

[[bin]]
name = "network-manager"
path = "src/main.rs"

[[bin]]
name = "network-status"
path = "src/bin/network-status.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true

[[test]]
name = "private_bus"
path = "tests/private_bus.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
