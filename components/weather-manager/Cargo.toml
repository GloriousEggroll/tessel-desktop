[package]
name = "weather-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Weather popup, settings, SNI tray and panel status stream (port of btmanager/weather-manager)."

[lib]
name = "weather_manager"
path = "src/lib.rs"

[[bin]]
name = "weather-manager"
path = "src/main.rs"

[[bin]]
name = "weather-status"
path = "src/bin/weather-status.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
gtk.workspace = true
serde_json.workspace = true
libc.workspace = true
ureq = { version = "2.12", default-features = false, features = ["native-tls", "proxy-from-env"] }
native-tls = "0.2"

[[test]]
name = "private_bus"
path = "tests/private_bus.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
