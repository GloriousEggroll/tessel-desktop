[package]
name = "tessel-prompt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Port of tessel_prompt.py: on-demand labwc promptCommand/errorCommand dialog (+ install_prompts.py pure logic)."

[lib]
name = "tessel_prompt"
path = "src/lib.rs"

[[bin]]
name = "tessel-prompt"
path = "src/main.rs"

[[bin]]
name = "tessel-install-prompts"
path = "src/bin/tessel-install-prompts.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
tessel-theme = { path = "../theme" }
glib.workspace = true
gio.workspace = true
gtk.workspace = true
libc.workspace = true
regex.workspace = true
sha2 = "0.10"
roxmltree = "0.21"
serde_json.workspace = true


[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
