[package]
name = "language-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Desktop and system language wizard (port of btmanager/language-manager)."

[lib]
name = "language_manager"
path = "src/lib.rs"

[[bin]]
name = "language-manager"
path = "src/main.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
gtk.workspace = true
glib.workspace = true
gio.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true

[[test]]
name = "ui"
path = "tests/ui.rs"
harness = false

