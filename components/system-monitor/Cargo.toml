[package]
name = "system-monitor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "System Monitor (port of btmanager/system-monitor): processes, performance, storage, network, graphics; direct /proc + /sys sampling."

[lib]
name = "system_monitor"
path = "src/lib.rs"

[[bin]]
name = "system-monitor"
path = "src/main.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
gtk.workspace = true
glib.workspace = true
gio.workspace = true
serde_json.workspace = true
libc.workspace = true

[dev-dependencies]
suite-wayland = { workspace = true }

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
