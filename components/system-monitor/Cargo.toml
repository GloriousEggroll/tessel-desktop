[package]
name = "tessel-system-monitor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "System Monitor: processes, performance, storage, network, graphics; direct /proc + /sys sampling."

[lib]
name = "tessel_system_monitor"
path = "src/lib.rs"

[[bin]]
name = "tessel-system-monitor"
path = "src/main.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
gtk.workspace = true
glib.workspace = true
gio.workspace = true
serde_json.workspace = true
libc.workspace = true

[dev-dependencies]
tessel-wayland = { workspace = true }

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
