[package]
name = "lock-screen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Wayshell secure session lock (ext-session-lock-v1) + waylock-pam helper (Rust port of lock-screen/)."
build = "build.rs"

[lib]
name = "lock_screen"
path = "src/lib.rs"

[[bin]]
name = "lock-screen"
path = "src/main.rs"

[[bin]]
name = "waylock-pam"
path = "src/bin/waylock-pam.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
suite-lock = { workspace = true, features = ["gtk"] }
gtk.workspace = true
glib.workspace = true
gio.workspace = true
libc.workspace = true
serde_json.workspace = true
zeroize = "1"
async-channel = "2"
on-screen-keyboard = { path = "../on-screen-keyboard" }

[[test]]
name = "pam_helper"
path = "tests/pam_helper.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
