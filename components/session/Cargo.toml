[package]
name = "tessel-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "On-demand session popup/menu: lock, switch user, log out, sleep, restart, power off (port of tessel-bluetooth/tessel-session)."

[lib]
name = "tessel_session"
path = "src/lib.rs"

[[bin]]
name = "tessel-session"
path = "src/main.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
