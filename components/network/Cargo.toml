[package]
name = "tessel-network"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "NetworkManager popup, settings, connection editor and secret agent (netman)."

[lib]
name = "tessel_network"
path = "src/lib.rs"

[[bin]]
name = "tessel-network"
path = "src/main.rs"

[[bin]]
name = "tessel-network-status"
path = "src/bin/tessel-network-status.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true

[[test]]
name = "private_bus"
path = "tests/private_bus.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
