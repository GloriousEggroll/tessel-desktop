[package]
name = "notification-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Notification daemon, history popup and settings for the labwc desktop suite (Rust port)."

[lib]
name = "notification_manager"
path = "src/lib.rs"

# Mirrors notification_manager.py (--daemon/--check/--settings/--popup).
[[bin]]
name = "notification-manager"
path = "src/main.rs"

# Mirrors notification_status.py (Waydock indicator stream); GLib/Gio only.
[[bin]]
name = "notification-status"
path = "src/bin/notification-status.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true
indexmap = "2"

[[test]]
name = "dbus"
path = "tests/dbus.rs"
harness = false

[[test]]
name = "headless"
path = "tests/headless.rs"
harness = false
