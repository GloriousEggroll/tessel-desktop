[package]
name = "tessel-auth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "tessel-auth: GTK4 Polkit authentication agent + BlueZ pairing agent."

[lib]
name = "tessel_auth"
path = "src/lib.rs"

[[bin]]
name = "tessel-auth"
path = "src/main.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
gtk.workspace = true
glib.workspace = true
gio.workspace = true
libc.workspace = true
glib-unix = "0.22"

[[test]]
name = "private_bus"
path = "tests/private_bus.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false

[[test]]
name = "polkit_register"
path = "tests/polkit_register.rs"
