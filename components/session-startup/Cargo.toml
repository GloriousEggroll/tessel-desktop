[package]
name = "tessel-session-startup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "labwc session generators (tessel-configure-session, tessel-xdg-autostart), the one-time tessel-migrate and the tessel-failed crash notifier."

[lib]
name = "tessel_session_startup"
path = "src/lib.rs"

[[bin]]
name = "tessel-configure-session"
path = "src/bin/tessel-configure-session.rs"

[[bin]]
name = "tessel-xdg-autostart"
path = "src/bin/tessel-xdg-autostart.rs"

[[bin]]
name = "tessel-failed"
path = "src/bin/tessel-failed.rs"

[[bin]]
name = "tessel-migrate"
path = "src/bin/tessel-migrate.rs"

[[bin]]
name = "tessel-icon-theme"
path = "src/bin/tessel-icon-theme.rs"

[dependencies]
tessel-core.workspace = true
glib.workspace = true
gio.workspace = true
regex.workspace = true
libc.workspace = true
roxmltree = "0.21"
