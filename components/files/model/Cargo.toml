[package]
name = "tessel-files-model"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Files model without GTK widgets: folder model, launching, the org.tessel.Files bus, location completion, Go Anywhere and devices."

[lib]
name = "tessel_files_model"
path = "src/lib.rs"

[dependencies]
tessel-core.workspace = true
glib.workspace = true
gio.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true
async-channel = "2"
tessel-dock = { path = "../../dock" }
