[package]
name = "tessel-files-model"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Files model without GTK widgets: file_model.py, file_launch.py, tessel_files_bus.py, location_completion/file_goto logic, files_devices data."

[lib]
name = "tessel_files_model"
path = "src/lib.rs"

[dependencies]
tessel-core.workspace = true
glib.workspace = true
gio.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true
async-channel = "2"
tessel-dock = { path = "../../dock" }
