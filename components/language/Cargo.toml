tessel-gtk.workspace = true
gtk.workspace = true
glib.workspace = true
gio.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true

[[test]]
name = "ui"
path = "tests/ui.rs"
harness = false

