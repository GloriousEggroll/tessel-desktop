[package]
name = "tessel-language"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Desktop and system language wizard (port of tessel-bluetooth/tessel-language)."

[lib]
name = "tessel_language"
path = "src/lib.rs"

[[bin]]
name = "tessel-language"
path = "src/main.rs"

[dependencies]
