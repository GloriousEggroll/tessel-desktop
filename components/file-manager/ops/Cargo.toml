[package]
name = "files-ops"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Files backend without GTK: file_operations.py, file_tools.py, file_extras.py, file_preferences.py."

[lib]
name = "files_ops"
path = "src/lib.rs"

[dependencies]
suite-core.workspace = true
glib.workspace = true
gio.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true
async-channel = "2.5"
zip = { version = "9.1", default-features = false, features = ["deflate-flate2", "bzip2", "lzma"] }
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1"
bzip2 = "0.6"
xz2 = "0.1.7"
md-5 = "0.10.6"
sha1 = "0.10.6"
sha2 = "0.10.9"
sha3 = "0.10.8"
blake2 = "0.10.6"
digest = "0.10.7"
ruzstd = "0.9"
