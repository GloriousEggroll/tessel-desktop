[package]
name = "file-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Files (wayfiles, org.waydock.Files): GTK4/GIO file manager with tabs, split panes, Miller columns, previews and safe file operations."

[lib]
name = "wayfiles"
path = "src/lib.rs"

[[bin]]
name = "wayfiles"
path = "src/main.rs"

[dependencies]
files-ops = { path = "ops" }
files-model = { path = "model" }
files-widgets = { path = "widgets" }
waydock = { path = "../waydock" }
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
serde_json.workspace = true
libc.workspace = true

[dev-dependencies]
files-ops = { path = "ops" }

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
