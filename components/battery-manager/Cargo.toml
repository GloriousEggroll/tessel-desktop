[package]
name = "battery-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Battery status and charging controls (port of btmanager/battery-manager)."

[lib]
name = "battery_manager"
path = "src/lib.rs"

[[bin]]
name = "battery-manager"
path = "src/main.rs"

[[bin]]
name = "battery-status"
path = "src/bin/battery_status.rs"
test = false

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
gtk.workspace = true
serde_json.workspace = true
libc.workspace = true
glib-unix = "0.22"
indexmap = "2"

[[test]]
name = "private_bus"
path = "tests/private_bus.rs"
harness = false

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
