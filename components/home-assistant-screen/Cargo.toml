[package]
name = "home-assistant-screen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Kasumi idle dashboard (luna_clock.py), its WebKit admin panel, levels, timers, alarms and the local voice-command backend (port of btmanager/home-assistant-screen)."

[lib]
name = "kasumi_screen"
path = "src/lib.rs"

[[bin]]
name = "luna-clock"
path = "src/bin/luna-clock.rs"

[[bin]]
name = "voice-controls"
path = "src/bin/voice-controls.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
suite-lock = { workspace = true, features = ["gtk"] }
on-screen-keyboard = { path = "../on-screen-keyboard" }
weather-manager = { path = "../weather-manager" }
media-manager = { path = "../media-manager" }
glib.workspace = true
gio.workspace = true
gtk.workspace = true
serde_json.workspace = true
libc.workspace = true

[[test]]
name = "dashboard_headless"
path = "tests/dashboard_headless.rs"
harness = false
