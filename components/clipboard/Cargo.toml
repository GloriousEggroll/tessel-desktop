[package]
name = "tessel-clipboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "tessel-clipboard: keeps the clipboard (and optionally the middle-click selection) after the application that copied it closes."

[lib]
name = "tessel_clipboard"
path = "src/lib.rs"

[[bin]]
name = "tessel-clipboard"
path = "src/main.rs"

[dependencies]
tessel-clipboard-settings = { path = "settings", default-features = false }
tessel-core.workspace = true
libc.workspace = true
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[[test]]
name = "headless"
harness = false
