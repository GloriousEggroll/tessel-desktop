[package]
name = "tessel-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Audio Settings, the volume popup/keys OSD and the persistent PipeWire loopback service."

[lib]
name = "tessel_audio"
path = "src/lib.rs"

# Python: tessel_audio.py (GTK app: --settings/--popup/--volume-*)
[[bin]]
name = "tessel-audio"
path = "src/bin/audio_manager.rs"

# Python: loopback_service.py (tessel-audio-loopbacks.service)
[[bin]]
name = "tessel-audio-loopbacks"
path = "src/bin/loopback_service.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true
indexmap = "2"

[[test]]
name = "loopback_integration"
path = "tests/loopback_integration.rs"
harness = false

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
