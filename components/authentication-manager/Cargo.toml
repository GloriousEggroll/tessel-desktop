[package]
name = "authentication-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "polkitman: GTK4 Polkit authentication agent + BlueZ pairing agent (Rust port of authentication_manager.py)."

[lib]
name = "authentication_manager"
path = "src/lib.rs"

[[bin]]
name = "authentication-manager"
path = "src/main.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
gtk.workspace = true
glib.workspace = true
gio.workspace = true
libc.workspace = true
glib-unix = "0.22"

[[test]]
name = "private_bus"
path = "tests/private_bus.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false

[[test]]
name = "polkit_register"
path = "tests/polkit_register.rs"
