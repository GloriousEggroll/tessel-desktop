[package]
name = "tessel-tiling"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tessel Tiling: labwc native tiling client, status stream, rc.xml overlay and shortcut popup."

[lib]
name = "tessel_tiling"
path = "src/lib.rs"

[[bin]]
name = "tessel-tiling"
path = "src/main.rs"

[[bin]]
name = "tessel-tiling-status"
path = "src/bin/tessel-tiling-status.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
gtk.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
