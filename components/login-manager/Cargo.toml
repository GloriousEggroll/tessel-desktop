[package]
name = "login-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Waylogin: greetd greeter (GTK4 + layer shell), root appearance helper and post-login desktop fade (Rust port of login-manager/)."

[lib]
name = "waylogin"
path = "src/lib.rs"

[[bin]]
name = "login-ui"
path = "src/bin/login-ui.rs"

[[bin]]
name = "session-transition"
path = "src/bin/session-transition.rs"

# Root helper: deliberately does not use the `waylogin` library (no GTK linked).
[[bin]]
name = "login-settings-helper"
path = "src/bin/login-settings-helper.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
suite-lock = { workspace = true, features = ["gtk"] }
gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true
zeroize = "1"
async-channel = "2"
on-screen-keyboard = { path = "../on-screen-keyboard" }

[[test]]
name = "helper_cli"
path = "tests/helper_cli.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
