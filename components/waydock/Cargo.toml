[package]
name = "waydock"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Waydock: dock/panel, application menu, StatusNotifier tray, indicators and appearance publishers (port of btmanager/waydock)."

[lib]
name = "waydock"
path = "src/lib.rs"

[[bin]]
name = "waydock"
path = "src/main.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
suite-wayland = { workspace = true, features = ["glib", "gtk"] }
media-manager = { path = "../media-manager" }
network-discovery = { path = "../network-discovery" }
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true
indexmap = "2"
x11rb = { version = "0.13", default-features = false }
roxmltree = "0.21"
glib-unix.workspace = true

[[test]]
name = "wl_headless"
harness = false

[[test]]
name = "b_private_bus"
harness = false

[[test]]
name = "g_settings_headless"
harness = false

[[test]]
name = "f2_ui_headless"
harness = false

[[test]]
name = "f1_ui_headless"
harness = false

[[test]]
name = "e_headless"
harness = false
