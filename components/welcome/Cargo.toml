[package]
name = "welcome"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Welcome (org.waydock.Welcome): first-run walk through language, keyboard, layout, light/dark and shortcuts, reusing the Global Settings pages."

[lib]
name = "welcome"
path = "src/lib.rs"

[[bin]]
name = "desktop-suite-welcome"
path = "src/main.rs"

[features]
default = ["pages"]
# The real Global Settings pages; `--no-default-features` builds Welcome with fallbacks only.
pages = ["global-settings/pages", "dep:gs-applets", "dep:gs-desktop", "dep:gs-system", "dep:language-manager"]

[dependencies]
global-settings = { path = "../global-settings", default-features = false }
gs-base = { path = "../global-settings/base" }
gs-applets = { path = "../global-settings/applets", optional = true }
gs-desktop = { path = "../global-settings/desktop", optional = true }
gs-system = { path = "../global-settings/system", optional = true }
language-manager = { path = "../language-manager", optional = true }
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
serde_json.workspace = true
libc.workspace = true

[[test]]
name = "welcome_headless"
path = "tests/welcome_headless.rs"
harness = false

[dev-dependencies]
