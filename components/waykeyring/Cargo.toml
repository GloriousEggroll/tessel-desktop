[package]
name = "waykeyring"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "waykeyring: the desktop suite's Secret Service (org.freedesktop.secrets), unlocked with the login password."

[lib]
name = "waykeyring"
path = "src/lib.rs"

[[bin]]
name = "waykeyring"
path = "src/main.rs"

[dependencies]
suite-core.workspace = true
glib.workspace = true
gio.workspace = true
serde_json.workspace = true
libc.workspace = true
argon2 = "0.5"
chacha20poly1305 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
num-bigint = "0.4"
getrandom = "0.2"
zeroize = "1"
base64 = "0.22"
