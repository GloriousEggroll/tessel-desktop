[package]
name = "way-displays"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Displays (way-displays-gui): arrange outputs through the way-displays daemon, XWayland primary, labwc HDR/colour overrides, brightness controls."

[lib]
name = "way_displays"
path = "src/lib.rs"

[[bin]]
name = "way-displays-gui"
path = "src/main.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true
yaml-rust2 = "0.10"
roxmltree = "0.20"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
