[package]
name = "tessel-text-editor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Text Editor (tessel_text_editor.py): one document per window, GtkSourceView 5, guarded atomic saves, crash-recovery drafts."

[lib]
name = "tessel_text_editor"
path = "src/lib.rs"

[[bin]]
name = "tessel-text-editor"
path = "src/main.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true
sourceview5 = { version = "0.11", features = ["v5_18"] }
encoding_rs = "0.8"
sha2 = "0.10"
futures-channel = "0.3"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
