[package]
name = "tessel-displays"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Displays (tessel-displays): the display settings window and the daemon that applies them, XWayland primary, labwc HDR/colour overrides, brightness controls."

[lib]
name = "tessel_displays"
path = "src/lib.rs"

[[bin]]
name = "tessel-displays"
path = "src/main.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
regex.workspace = true
yaml-rust2 = "0.10"
roxmltree = "0.20"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
