[package]
name = "tessel-brightness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Monitor brightness/contrast (DDC/CI + logind backlight), scaling proxy, auto-dim, keyboard OSD and the Displays popup."

[lib]
name = "tessel_brightness"
path = "src/lib.rs"

[[bin]]
name = "tessel-brightness"
path = "src/main.rs"

[[bin]]
name = "tessel-brightness-status"
path = "src/bin/tessel-brightness-status.rs"
test = false

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
glib-unix = "0.22"
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true
sha2 = "0.10"
yaml-rust2 = "0.10"
async-channel = "2"

[[test]]
name = "private_bus"
path = "tests/private_bus.rs"
harness = false

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
