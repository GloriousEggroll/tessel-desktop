[package]
name = "archive-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Archive Manager (wayarchive, org.waydock.ArchiveManager): GTK4 archive manager with Ark's features, plugins and drag-and-drop protocol."
build = "build.rs"

[lib]
name = "archive_manager"
path = "src/lib.rs"

[[bin]]
name = "wayarchive"
path = "src/main.rs"

[dependencies]
archive-settings = { path = "settings" }
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
serde_json.workspace = true
libc.workspace = true
async-channel = "2.5"
md-5 = "0.10.6"
sha1 = "0.10.6"
sha2 = "0.10.9"

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
