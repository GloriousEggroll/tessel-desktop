[package]
name = "tessel-hdr-calibration"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HDR Calibration: per-monitor HDR limits and SDR white via labwc's managed rc.xml block. Uses the C hdr-pattern helper."

[lib]
name = "tessel_hdr_calibration"
path = "src/lib.rs"

[[bin]]
name = "tessel-hdr-calibration"
path = "src/main.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
gtk.workspace = true
glib.workspace = true
gio.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true
roxmltree = "0.20"
tessel-displays = { path = "../displays" }

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
