[package]
name = "hdr-calibration"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HDR Calibration (port of btmanager/hdr-calibration): per-monitor HDR limits and SDR white via labwc's managed rc.xml block. Uses the C hdr-pattern helper."

[lib]
name = "hdr_calibration"
path = "src/lib.rs"

[[bin]]
name = "hdr-calibration"
path = "src/main.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
gtk.workspace = true
glib.workspace = true
gio.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true
roxmltree = "0.20"
way-displays = { path = "../way-displays" }

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
