[package]
name = "picture-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pictures (org.waydock.Pictures, waypictures): GTK4 picture viewer and simple editor with bounded undo and atomic saves."

[lib]
name = "picture_viewer"
path = "src/lib.rs"

[[bin]]
name = "waypictures"
path = "src/main.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
serde_json.workspace = true
libc.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "pnm", "tga", "qoi"] }
kamadak-exif = "0.6"
futures-channel = "0.3"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
