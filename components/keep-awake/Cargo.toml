[package]
name = "keep-awake"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Manual logind idle/sleep inhibitor with a layer-shell popup (port of btmanager/keep-awake)."

[lib]
name = "keep_awake"
path = "src/lib.rs"

[[bin]]
name = "keep-awake"
path = "src/main.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
gtk.workspace = true
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
serde_json.workspace = true
libc.workspace = true

[[test]]
name = "ui"
harness = false
