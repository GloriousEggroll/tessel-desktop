[package]
name = "tessel-weather"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Weather popup, settings, SNI tray and panel status stream."

[lib]
name = "tessel_weather"
path = "src/lib.rs"

[[bin]]
name = "tessel-weather"
path = "src/main.rs"

[[bin]]
name = "tessel-weather-status"
path = "src/bin/tessel-weather-status.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
gtk.workspace = true
serde_json.workspace = true
libc.workspace = true
ureq = { version = "2.12", default-features = false, features = ["native-tls", "proxy-from-env"] }
native-tls = "0.2"

[[test]]
name = "private_bus"
path = "tests/private_bus.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
