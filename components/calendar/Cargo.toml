[package]
name = "tessel-calendar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Waybar/Tessel Dock calendar popup with read-only iCalendar events and system date settings."

[lib]
name = "tessel_calendar"
path = "src/lib.rs"

[[bin]]
name = "tessel-calendar"
path = "src/main.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
gtk.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true

[[test]]
name = "engine_parity"
path = "tests/engine_parity.rs"

[[test]]
name = "private_bus"
path = "tests/private_bus.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false

[[test]]
name = "fetch"
path = "tests/fetch.rs"
