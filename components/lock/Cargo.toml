[package]
name = "tessel-lock"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tessel secure session lock (ext-session-lock-v1) + tessel-lock-pam helper (Rust port of tessel-lock/)."
build = "build.rs"

[lib]
name = "tessel_lock"
path = "src/lib.rs"

[[bin]]
name = "tessel-lock"
path = "src/main.rs"

[[bin]]
name = "tessel-lock-pam"
path = "src/bin/tessel-lock-pam.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
tessel-locking = { workspace = true, features = ["gtk"] }
gtk.workspace = true
glib.workspace = true
gio.workspace = true
libc.workspace = true
serde_json.workspace = true
zeroize = "1"
async-channel = "2"
tessel-keyboard = { path = "../keyboard" }

[[test]]
name = "pam_helper"
path = "tests/pam_helper.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
