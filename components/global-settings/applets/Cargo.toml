[package]
name = "gs-applets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Global Settings applet pages (applet_pages.py, weather_page.py, language_page.py, capture_page.py)."

[lib]
name = "gs_applets"
path = "src/lib.rs"

[dependencies]
gs-base = { path = "../base" }
suite-core.workspace = true
suite-gtk.workspace = true
suite-power.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
serde_json.workspace = true
audio-manager = { path = "../../audio-manager" }
bluetooth-manager = { path = "../../bluetooth-manager" }
network-manager = { path = "../../network-manager" }
power-manager = { path = "../../power-manager" }
battery-manager = { path = "../../battery-manager" }
keep-awake = { path = "../../keep-awake" }
notification-manager = { path = "../../notification-manager" }
calendar-manager = { path = "../../calendar-manager" }
weather-manager = { path = "../../weather-manager" }
language-manager = { path = "../../language-manager" }
capture-manager = { path = "../../capture-manager" }
archive-settings = { path = "../../archive-manager/settings" }

# GTK checks: run only through components/global-settings/tests/headless.sh
# (private headless labwc + private bus); under plain `cargo test` they skip.
[[test]]
name = "applets_headless"
path = "tests/applets_headless.rs"
harness = false

