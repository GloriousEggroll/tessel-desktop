<svg xmlns="http://www.w3.org/2000/svg" width="160" height="100" viewBox="0 0 160 100">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2a6e"/>
      <stop offset=".55" stop-color="#b0457c"/>
      <stop offset="1" stop-color="#f29a5c"/>
    </linearGradient>
    <clipPath id="screen"><rect x="2" y="2" width="156" height="96" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">
    <rect x="2" y="2" width="156" height="96" fill="url(#desk)"/>
    <!-- Menu bar across the top -->
    <rect x="2" y="2" width="156" height="8" fill="#1c1c22" fill-opacity=".55"/>
    <circle cx="9" cy="6" r="1.8" fill="#f2f2f5"/>
    <rect x="14" y="5" width="12" height="2" rx="1" fill="#f2f2f5"/>
    <rect x="30" y="5" width="8" height="2" rx="1" fill="#d5d5dc"/>
    <rect x="41" y="5" width="8" height="2" rx="1" fill="#d5d5dc"/>
    <rect x="126" y="5" width="4" height="2" rx="1" fill="#d5d5dc"/>
    <rect x="133" y="5" width="20" height="2" rx="1" fill="#f2f2f5"/>
    <!-- A window with traffic lights on the left -->
    <rect x="34" y="18" width="92" height="52" rx="5" fill="#f4f4f7" fill-opacity=".94"/>
    <rect x="34" y="18" width="92" height="9" rx="5" fill="#e3e3e9"/>
    <rect x="34" y="23" width="92" height="4" fill="#e3e3e9"/>
    <circle cx="40" cy="22.5" r="1.8" fill="#ff5f57"/>
    <circle cx="45.5" cy="22.5" r="1.8" fill="#febc2e"/>
    <circle cx="51" cy="22.5" r="1.8" fill="#28c840"/>
    <rect x="42" y="33" width="44" height="3" rx="1.5" fill="#c6c8d1"/>
    <rect x="42" y="40" width="72" height="3" rx="1.5" fill="#d6d8de"/>
    <rect x="42" y="47" width="60" height="3" rx="1.5" fill="#d6d8de"/>
    <!-- Floating dock with magnified icon -->
    <rect x="38" y="82" width="84" height="13" rx="4.5" fill="#f4f4f7" fill-opacity=".35"/>
    <rect x="42" y="84.5" width="8" height="8" rx="2" fill="#4c9cf2"/>
    <rect x="53" y="84.5" width="8" height="8" rx="2" fill="#f2b33d"/>
    <rect x="63.5" y="80.5" width="12" height="12" rx="3" fill="#33c46a"/>
    <rect x="78.5" y="84.5" width="8" height="8" rx="2" fill="#e05d5d"/>
    <rect x="89.5" y="84.5" width="8" height="8" rx="2" fill="#9b6cf0"/>
    <rect x="101" y="84" width=".8" height="9" fill="#ffffff" fill-opacity=".6"/>
    <rect x="104" y="84.5" width="8" height="8" rx="2" fill="#8c95a3"/>
  </g>
  <rect x="2" y="2" width="156" height="96" rx="8" fill="none" stroke="#ffffff" stroke-opacity=".18"/>
</svg>
