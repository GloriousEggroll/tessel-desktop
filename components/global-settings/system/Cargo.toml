[package]
name = "gs-system"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Global Settings system pages: input, keyboard, shortcuts, accessibility, default apps, night light, users, about, workspaces."

[lib]
name = "gs_system"
path = "src/lib.rs"

[dependencies]
gs-base = { path = "../base" }
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
serde_json.workspace = true
regex.workspace = true
libc.workspace = true
tiling-manager = { path = "../../tiling-manager" }
on_screen_keyboard = { package = "on-screen-keyboard", path = "../../on-screen-keyboard" }

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false

[[test]]
name = "python_parity"
path = "tests/python_parity.rs"
harness = false
