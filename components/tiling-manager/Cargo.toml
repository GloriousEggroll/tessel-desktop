[package]
name = "tiling-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Waytile: labwc native tiling client, status stream, rc.xml overlay and shortcut popup (port of btmanager/tiling-manager)."

[lib]
name = "tiling_manager"
path = "src/lib.rs"

[[bin]]
name = "waytile"
path = "src/main.rs"

[[bin]]
name = "tiling-status"
path = "src/bin/tiling-status.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
gtk.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false

[[test]]
name = "python_parity"
path = "tests/python_parity.rs"
