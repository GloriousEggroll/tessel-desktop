[package]
name = "network-discovery"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Avahi network discovery toggle and device list popup (port of btmanager/network-discovery)."

[lib]
name = "network_discovery"
path = "src/lib.rs"

[[bin]]
name = "network-discovery"
path = "src/main.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
gtk.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true

[[test]]
name = "private_bus"
path = "tests/private_bus.rs"
harness = false

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
