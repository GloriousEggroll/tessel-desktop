      <rect x="9" y="10.5" width="1.2" height="1.2" rx=".2"/><rect x="11" y="10.5" width="1.2" height="1.2" rx=".2"/>
    </g>
    <rect x="15.5" y="8" width="4.5" height="5" rx="1.2" fill="#69a7ff"/>
    <circle cx="23" cy="10.5" r="1" fill="#9aa3b5"/>
    <circle cx="26.5" cy="10.5" r="1" fill="#9aa3b5"/>
    <rect x="31" y="8" width="5" height="5" rx="1.3" fill="#e66100"/>
