    <rect x="45" y="8" width="5" height="5" rx="1.3" fill="#3584e4"/>
    <rect x="52" y="8" width="5" height="5" rx="1.3" fill="#f6d32d"/>
    <rect x="71" y="9.5" width="18" height="2" rx="1" fill="#f0f0f0"/>
    <rect x="125" y="9.5" width="3" height="2" rx="1" fill="#d0d0d0"/>
    <rect x="130" y="9.5" width="3" height="2" rx="1" fill="#d0d0d0"/>
    <rect x="135" y="9.5" width="3" height="2" rx="1" fill="#d0d0d0"/>
    <rect x="145" y="9" width="5" height="3" rx="1.5" fill="#f0f0f0"/>
    <!-- Windows share the same gaps as the islands -->
    <g>
      <rect x="6" y="19" width="84" height="73" rx="3" fill="#fafafa" fill-opacity=".95"/>
      <rect x="6" y="19" width="84" height="7" rx="3" fill="#e6e6e6"/>
      <rect x="6" y="23" width="84" height="3" fill="#e6e6e6"/>
