      <rect x="13" y="46" width="52" height="3" rx="1.5" fill="#dddddd"/>
      <rect x="94" y="19" width="60" height="34.5" rx="3" fill="#2b2e38" fill-opacity=".96"/>
      <rect x="94" y="19" width="60" height="7" rx="3" fill="#3b3f4c"/>
      <rect x="94" y="23" width="60" height="3" fill="#3b3f4c"/>
      <rect x="100" y="32" width="26" height="2.5" rx="1.2" fill="#7ad17a"/>
