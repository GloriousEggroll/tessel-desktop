<svg xmlns="http://www.w3.org/2000/svg" width="160" height="100" viewBox="0 0 160 100">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2d5c"/>
      <stop offset=".55" stop-color="#3a5796"/>
      <stop offset="1" stop-color="#8a5a94"/>
    </linearGradient>
    <clipPath id="screen"><rect x="2" y="2" width="156" height="96" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#screen)">
    <rect x="2" y="2" width="156" height="96" fill="url(#desk)"/>
    <!-- One top bar in three islands: menu, workspaces and apps; clock; status -->
    <g fill="#10141f" fill-opacity=".86">
      <rect x="6" y="6" width="54" height="9" rx="3"/>
      <rect x="67" y="6" width="26" height="9" rx="3"/>
      <rect x="121" y="6" width="33" height="9" rx="3"/>
