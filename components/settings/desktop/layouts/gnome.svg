    <rect x="4.5" y="53" width="10" height="10" rx="2.5" fill="#f6d32d"/>
    <rect x="2.6" y="30" width="1" height="4" rx=".5" fill="#e95420"/>
    <g fill="#d8d8d8">
      <rect x="5.5" y="85" width="2" height="2" rx=".4"/><rect x="8.5" y="85" width="2" height="2" rx=".4"/><rect x="11.5" y="85" width="2" height="2" rx=".4"/>
      <rect x="5.5" y="88" width="2" height="2" rx=".4"/><rect x="8.5" y="88" width="2" height="2" rx=".4"/><rect x="11.5" y="88" width="2" height="2" rx=".4"/>
      <rect x="5.5" y="91" width="2" height="2" rx=".4"/><rect x="8.5" y="91" width="2" height="2" rx=".4"/><rect x="11.5" y="91" width="2" height="2" rx=".4"/>
