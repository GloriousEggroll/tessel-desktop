[package]
name = "tessel-settings"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Global Settings (org.tessel.GlobalSettings): one lazy-loaded window for every Tessel setting."

[lib]
name = "tessel_settings"
path = "src/lib.rs"

[[bin]]
name = "tessel-settings"
path = "src/main.rs"

[[bin]]
name = "tessel-night-light"
path = "src/bin/tessel-night-light.rs"
required-features = ["pages"]

[features]
default = ["pages"]
# The real pages; `--no-default-features` builds the shell alone (tests with fake pages).
pages = ["dep:gs-applets", "dep:gs-desktop", "dep:gs-system"]

[dependencies]
gs-base = { path = "base" }
gs-applets = { path = "applets", optional = true }
gs-desktop = { path = "desktop", optional = true }
gs-system = { path = "system", optional = true }
tessel-core.workspace = true
tessel-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
serde_json.workspace = true
regex.workspace = true
unicode-normalization = "0.1"

[[test]]
name = "shell_headless"
path = "tests/shell_headless.rs"
harness = false
