[package]
name = "on-screen-keyboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Waykeys: automatic touch keyboard for the labwc session (Rust port of osk_manager.py)."
build = "build.rs"

[lib]
name = "waykeys"
path = "src/lib.rs"

[[bin]]
name = "osk-manager"
path = "src/bin/osk-manager.rs"

[[bin]]
name = "osk-status"
path = "src/bin/osk-status.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
glib.workspace = true
gio.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true
glib-unix = "0.22"
udev = "0.9"
unicode-normalization = "0.1"

[[test]]
name = "ui"
harness = false

[[test]]
name = "lock_monitor"
harness = false

[build-dependencies]
cc.workspace = true
