[package]
name = "wayshell-capture-picker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Wayshell's on-demand GTK4 xdg-desktop-portal-wlr dmenu chooser (port of wayshell/capture_picker.py and friends)."

[lib]
name = "wayshell_capture_picker"
path = "src/lib.rs"

[[bin]]
name = "wayshell-capture-picker"
path = "src/main.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
# tiling_client.request (the `capture-output <identifier>` datagram request).
tiling-manager = { path = "../tiling-manager" }
glib.workspace = true
gio.workspace = true
gtk.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true
gio-unix = "0.22"

[[test]]
name = "entry"
path = "tests/entry.rs"

[[test]]
name = "selection_bus"
path = "tests/selection_bus.rs"
harness = false

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
