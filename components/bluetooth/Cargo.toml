[package]
name = "tessel-bluetooth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "tessel-bluetooth: GTK4 Bluetooth device manager, tray popup and OBEX file transfers (Rust port of tessel-bluetooth.py, btpopup.py, bttransfer.py)."

[lib]
name = "tessel_bluetooth"
path = "src/lib.rs"

[[bin]]
name = "tessel-bluetooth"
path = "src/main.rs"

[dependencies]
tessel-core.workspace = true
tessel-gtk.workspace = true
glib.workspace = true
gio.workspace = true
gtk.workspace = true
gtk4-layer-shell.workspace = true
serde_json.workspace = true
libc.workspace = true
regex.workspace = true

[[test]]
name = "private_bus"
path = "tests/private_bus.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
