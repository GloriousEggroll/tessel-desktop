[package]
name = "media-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "On-demand MPRIS media popup plus the shared MPRIS/icon/art/dock-status backends (port of btmanager/media-manager)."

[lib]
name = "media_manager"
path = "src/lib.rs"

[[bin]]
name = "media-manager"
path = "src/main.rs"

[dependencies]
suite-core.workspace = true
suite-gtk.workspace = true
glib.workspace = true
gio = { workspace = true, features = ["v2_80"] }
gio-unix = "0.22"
gtk.workspace = true
libc.workspace = true
regex.workspace = true
ureq = { version = "2.12", default-features = false, features = ["native-tls", "proxy-from-env"] }
native-tls = "0.2"

[[test]]
name = "private_bus"
path = "tests/private_bus.rs"

[[test]]
name = "ui_headless"
path = "tests/ui_headless.rs"
harness = false
